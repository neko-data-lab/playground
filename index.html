<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Links</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }
    header { margin-bottom: 40px; }
    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: 0.02em;
    }
    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    section { margin-bottom: 40px; }
    h2 {
      font-size: 1.1rem;
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .links {
      display: grid;
      gap: 12px;
    }
    .link-card {
      display: block;
      padding: 18px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .link-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .link-title {
      font-weight: 700;
      color: var(--accent);
    }
    .link-description {
      margin: 4px 0 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
    footer {
      margin-top: 64px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>My Links</h1>
      <p class="lead">自分用のリンク集です。今後、作品や記事などを追加していきます。</p>
    </header>

    <section>
      <h2>Works</h2>
      <div class="links">
        <!-- リンクを追加する場合は、この .link-card のブロックをコピーしてください -->
        <a class="link-card" href="jinbei_shark_jump_complete.html">
          <span class="link-title">ジンベエザメ ジャンプ</span>
          <p class="link-description">作品ページ</p>
        </a>
      </div>
    </section>

    <footer>
      &copy; 2026
    </footer>
  </main>
</body>
</html>
